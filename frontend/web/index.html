<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="বিদ্বান - Bidwaan Academic, Admission & Job Preparation Bangladesh's Edtech Platform.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bidwaan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/biddyan_logo.png"/>

  <title>Bidwaan</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 18px;
      background: #f4f6f5;
      color: #00343a;
      font: 700 16px system-ui, sans-serif;
      transition: opacity 240ms ease;
    }

    #app-loader.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .launch-mark {
      position: relative;
      display: grid;
      width: 112px;
      height: 112px;
      place-items: center;
      animation: launch-pulse 1.35s ease-in-out infinite;
    }

    .launch-mark img {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      object-fit: contain;
      box-shadow: 0 8px 24px #00343a1f;
    }

    .launch-tagline {
      max-width: 320px;
      padding: 0 18px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
    }

    .launch-mark::after {
      position: absolute;
      inset: 0;
      border: 3px solid #00343a1c;
      border-top-color: #00343A;
      border-radius: 50%;
      content: "";
      animation: launch-spin 1.1s linear infinite;
    }

    @keyframes launch-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes launch-pulse {
      50% { transform: scale(1.045); }
    }

    @media (prefers-reduced-motion: reduce) {
      .launch-mark,
      .launch-mark::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="app-loader" role="status" aria-label="Bidwaan loading">
    <div class="launch-mark">
      <img src="assets/assets/bidwaan_app_icon.png" alt="Bidwaan">
    </div>
    <span class="launch-tagline">বিদ্বান - Bidwaan Academic, Admission &amp; Job Preparation Bangladesh's Edtech Platform.</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const loader = document.getElementById('app-loader');
      if (!loader) return;
      loader.classList.add('is-hidden');
      window.setTimeout(() => loader.remove(), 260);
    }, { once: true });
  </script>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
        }
      } catch (error) {
        console.warn('Could not clear stale Flutter caches:', error);
      }

      const flutterScript = document.createElement('script');
      flutterScript.src = 'flutter_bootstrap.js';
      flutterScript.async = true;
      document.body.appendChild(flutterScript);
    })();
  </script>
</body>
</html>
