server {
    listen 80;
    server_name biddyan.test yourdomain.com; # Replace with your VPS IP or Domain name

    # Redirection to SSL if configured:
    # return 301 https://$host$request_uri;

    # Backend API Gateway reverse proxy
    location /api/ {
        proxy_pass http://localhost:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Flutter Web Application Root
    location / {
        root /var/www/biddyan/web;
        index index.html;
        try_files $uri $uri/ /index.html; # crucial for go_router nested URL routing support on refresh
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

